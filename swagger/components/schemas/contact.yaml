type: object
properties:
  _id:
    type: string
    example: '6877c757b2a44d75a2ae711b'
  name:
    type: string
    example: 'John Doe'
  phoneNumber:
    type: string
    example: '+380991234567'
  email:
    type: string
    example: 'example@example.com'
  isFavourite:
    type: boolean
    example: true
  contactType:
    type: string
    enum: [work, home, personal]
    example: 'personal'
  userId:
    type: string
    example: '6873c4a5dcb02ebe5df507d9'
  photo:
    type: string
    example: ''
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
